name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-new/package-lock.json

      - name: Install dependencies
        working-directory: frontend-new
        run: npm ci

      - name: Run tests
        working-directory: frontend-new
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: frontend-new
        run: npm run build

  llm-proxy:
    name: llm-proxy Edge Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run llm-proxy tests
        run: node --test supabase/functions/llm-proxy/core.test.ts supabase/functions/llm-proxy/core.http.test.ts
